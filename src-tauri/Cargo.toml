[package]
name = "kaiso"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaiso_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.12", features = ["ndarray", "download-binaries", "copy-dylibs"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "avif"] }
ndarray = "0.17.2"
kamadak-exif = "0.5"
jwalk = "0.8"
rayon = "1.10"
fast_image_resize = { version = "5", features = ["image"] }
anyhow = "1"
twox-hash = "2.1.2"
simsimd = "6.5"
rusqlite = "0.32.1"
bytemuck = "1.18"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"

